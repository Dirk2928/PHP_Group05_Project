services:
  - type: web
    name: brewski-app
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /login-signup/login.php
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_SSL
        value: "1"
      - key: DB_SSL_CA
        sync: false
      - key: EMAIL_SERVICE_URL
        sync: false
      - key: BREWSKI_TOTP_ENCRYPTION_KEY
        sync: false

  - type: web
    name: brewski-email
    runtime: node
    plan: free
    region: singapore
    rootDir: brewski/email-service
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: MAILJET_API_KEY
        sync: false
      - key: MAILJET_SECRET_KEY
        sync: false
      - key: MAILJET_SENDER
        sync: false
      - key: MAILJET_SENDER_NAME
        value: Brewski