services:
  - type: web
    name: brewski-app
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /login-signup/login.php
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_SSL
        value: "1"
      - key: DB_SSL_CA
        sync: false
      - key: MAILJET_API_KEY
        sync: false
      - key: MAILJET_SECRET_KEY
        sync: false
      - key: MAILJET_SENDER
        sync: false
      - key: MAILJET_SENDER_NAME
        value: Brewski
      - key: BREWSKI_TOTP_ENCRYPTION_KEY
        sync: false